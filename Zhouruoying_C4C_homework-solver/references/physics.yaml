# 学科域：大学物理（力学）
#
# 关键词覆盖 scripts/solvers_physics.py 的五个求解器门控：
# 自由落体 / 牛顿第二定律 / 抛体 / 动能定理 / 简谐运动。
domain: physics
label: 大学物理
solvers: [solvers_physics]
strong_keywords:
  - 自由落体
  - 自由下落
  - 静止开始下落
  - 落地速度
  - 合外力
  - 牛顿第二定律
  - 抛体
  - 斜抛
  - 抛射角
  - 射程
  - 动能定理
  - 重力势能
  - 简谐
  - 弹簧振子
  - 振动周期
  - 劲度系数
keywords:
  - 加速度
  - 初速度
  - 重力加速度
  - 高度
  - 质量
  - 物体
  - 动能
  - 动量
  - 弹簧
  - 振幅
  - 周期
  - 焦耳
  - 牛顿
  - m/s
negative_keywords:
  - 特征值
  - 行列式
  - 微分方程
